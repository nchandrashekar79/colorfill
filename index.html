<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorFill Kids — colouring game with shapes and letters</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="hud">
            <div class="hud-title">
                <h1>ColorFill Dhanya </h1>
                <p class="level-name" id="levelName">Level 1 of 70 — Tiny circle</p>
            </div>

            <dl class="stats">
                <div class="stat">
                    <dt>Score</dt>
                    <dd id="scoreValue">0</dd>
                </div>
                <div class="stat">
                    <dt>Painted</dt>
                    <dd id="filledValue">0%</dd>
                </div>
                <div class="stat">
                    <dt>Colours</dt>
                    <dd id="coloursValue">0</dd>
                </div>
            </dl>

            <div class="hud-actions">
                <button type="button" class="btn" id="soundBtn" aria-pressed="true">Sound: on</button>
                <button type="button" class="btn" id="levelsBtn">Levels</button>
            </div>
        </header>

        <section class="panel">
            <p class="panel-title">Pick a colour, then press and drag inside the shape to paint it in.</p>
            <div class="palette" id="palette" role="group" aria-label="Colour palette"></div>
            <p class="hint" id="starHint">Finish the shape for ★, use 3 colours for ★★ and 6 for ★★★.</p>
        </section>

        <section class="board-panel">
            <canvas id="board" class="board" tabindex="0" width="1000" height="560"
                    aria-label="Colouring board. Press and drag inside the shape to paint it."
                    title="Paint by dragging. Keyboard: Enter fills the shape, arrow keys change level."></canvas>
            <div class="meter" id="paintMeter" role="progressbar" aria-label="Shape painted"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span class="meter-fill" id="meterFill"></span>
            </div>
        </section>

        <div class="actions">
            <button type="button" class="btn" id="undoBtn">Undo</button>
            <button type="button" class="btn" id="clearBtn">Clear</button>
            <button type="button" class="btn" id="prevBtn">← Previous level</button>
            <button type="button" class="btn btn-primary" id="nextBtn">Next level →</button>
        </div>
    </main>

    <div class="overlay" id="levelsOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="levelsTitle">
            <h2 id="levelsTitle">Choose a level</h2>
            <p class="modal-sub">Total stars: <strong id="totalStarsValue">0 / 210</strong></p>
            <div class="level-tabs" id="levelTabs" role="tablist" aria-label="Level groups"></div>
            <div class="level-grid" id="levelGrid" role="tabpanel" aria-label="Levels"></div>
            <div class="modal-actions">
                <button type="button" class="btn" id="closeLevelsBtn">Close</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="winOverlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="winTitle">
            <h2 id="winTitle">Level complete!</h2>
            <p class="win-stars" id="winStars">★☆☆</p>
            <p class="modal-sub" id="winSummary"></p>
            <div class="modal-actions">
                <button type="button" class="btn" id="winPrevBtn">← Previous level</button>
                <button type="button" class="btn btn-primary" id="winNextBtn">Next level →</button>
                <button type="button" class="btn" id="winReplayBtn">Play again</button>
                <button type="button" class="btn" id="winLevelsBtn">Levels</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
